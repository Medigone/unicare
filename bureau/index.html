<!DOCTYPE html>
<html lang="fr" data-density="poste">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Thème posé avant l'application : pas de flash clair en mode sombre (même règle que src/lib/theme.ts).
      (function () {
        var pref = null
        try { pref = localStorage.getItem('bureau-theme') } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/unicare/images/bureau-icon.svg" />
    <title>Unicare Bureau</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
